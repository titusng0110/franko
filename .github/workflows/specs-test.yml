name: Spec test

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Compile and run spec programs (Linux x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Franko compiler toolchain
        run: |
          set -Eeuo pipefail

          mkdir -p build/generated build/classes

          java -Xmx500M -cp ".:lib/antlr-4.13.2-complete.jar" \
            org.antlr.v4.Tool -visitor -o build/generated Franko.g4

          javac --release 25 -Xlint:all,-auxiliaryclass \
            -cp ".:lib/antlr-4.13.2-complete.jar:build/generated" \
            -d build/classes *.java build/generated/*.java

      - name: Run success spec programs
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          CP=".:lib/antlr-4.13.2-complete.jar:build/generated:build/classes"
          JEM_INC="third_party/jemalloc/linux-x86_64/include"
          JEM_LIB="third_party/jemalloc/linux-x86_64/lib/libjemalloc.a"

          # Every program in tests/success/ is a positive test with a
          # checked-in .expected file.
          for SRC in tests/success/*/main.fr; do
            BASE="${SRC%.fr}"

            echo
            echo "=== $SRC ==="
            echo

            # Optional per-fixture compiler flags in $BASE.flags: each
            # non-empty, non-comment line is word-split and appended
            # to the compiler invocation (e.g. "-p <search-dir>").
            # Mirrors tests/run_specs_tests.sh.
            EXTRA_FLAGS=()
            if [[ -f "$BASE.flags" ]]; then
              while IFS= read -r LINE || [[ -n "$LINE" ]]; do
                [[ -z "$LINE" ]] && continue
                [[ "$LINE" == \#* ]] && continue
                # shellcheck disable=SC2206
                EXTRA_FLAGS+=($LINE)
              done < "$BASE.flags"
            fi

            java -cp "$CP" Main "$SRC" -o "$BASE.cpp" ${EXTRA_FLAGS[@]+"${EXTRA_FLAGS[@]}"}

            g++ \
              -O3 -std=c++14 -Wall -Wextra -Wpedantic -Wshadow \
              -Iinclude -I"$JEM_INC" \
              "$BASE.cpp" "$JEM_LIB" \
              -pthread -ldl -static-libstdc++ -static-libgcc \
              -o "$BASE.testbin"

            "$BASE.testbin" | tee "$BASE.actual"

            echo
            echo "Comparing output against $BASE.expected:"
            diff -u "$BASE.expected" "$BASE.actual"

            echo
            echo "PASS: $SRC ran successfully, output matches $BASE.expected"
          done

      - name: Run failure spec programs
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          CP=".:lib/antlr-4.13.2-complete.jar:build/generated:build/classes"

          # Every program in tests/failure/<family>/ is a negative test: the
          # Franko compiler must reject it (non-zero exit code). Helper files
          # that live deeper (for example tests/failure/imports/lib/) are
          # imported by a fixture and are not run standalone.
          for SRC in tests/failure/*/*.fr; do
            echo
            echo "=== $SRC ==="
            echo

            # Optional per-fixture compiler flags in <case>.flags.
            # Mirrors tests/run_specs_tests.sh.
            EXTRA_FLAGS=()
            if [[ -f "${SRC%.fr}.flags" ]]; then
              while IFS= read -r LINE || [[ -n "$LINE" ]]; do
                [[ -z "$LINE" ]] && continue
                [[ "$LINE" == \#* ]] && continue
                # shellcheck disable=SC2206
                EXTRA_FLAGS+=($LINE)
              done < "${SRC%.fr}.flags"
            fi

            if java -cp "$CP" Main "$SRC" -o /dev/null ${EXTRA_FLAGS[@]+"${EXTRA_FLAGS[@]}"} 2>/dev/null; then
              echo "FAIL: $SRC compiled successfully but was expected to fail."
              exit 1
            fi

            echo
            echo "PASS: $SRC was rejected by the Franko compiler as expected."
          done

      - name: Run runtime spec programs
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          CP=".:lib/antlr-4.13.2-complete.jar:build/generated:build/classes"
          JEM_INC="third_party/jemalloc/linux-x86_64/include"
          JEM_LIB="third_party/jemalloc/linux-x86_64/lib/libjemalloc.a"

          # Every program in tests/runtime/ compiles but is expected to
          # abort at run time (non-zero exit code). The abort output is
          # not compared: runtime messages may change freely.
          for SRC in tests/runtime/*/*.fr; do
            BASE="${SRC%.fr}"

            echo
            echo "=== $SRC ==="
            echo

            # Optional per-fixture compiler flags in <case>.flags.
            # Mirrors tests/run_specs_tests.sh.
            EXTRA_FLAGS=()
            if [[ -f "$BASE.flags" ]]; then
              while IFS= read -r LINE || [[ -n "$LINE" ]]; do
                [[ -z "$LINE" ]] && continue
                [[ "$LINE" == \#* ]] && continue
                # shellcheck disable=SC2206
                EXTRA_FLAGS+=($LINE)
              done < "$BASE.flags"
            fi

            java -cp "$CP" Main "$SRC" -o "$BASE.cpp" ${EXTRA_FLAGS[@]+"${EXTRA_FLAGS[@]}"}

            g++ \
              -O3 -std=c++14 \
              -Iinclude -I"$JEM_INC" \
              "$BASE.cpp" "$JEM_LIB" \
              -pthread -ldl -static-libstdc++ -static-libgcc \
              -o "$BASE.testbin"

            if "$BASE.testbin" > /dev/null 2>&1; then
              echo "FAIL: $SRC exited 0 but was expected to abort at runtime."
              exit 1
            fi

            echo
            echo "PASS: $SRC aborted at runtime as expected."
          done

  test-windows:
    name: Compile and run spec programs (Windows x64)
    runs-on: windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # UCRT64, matching build-jemalloc.yml and the checked-in windows-x64
      # jemalloc bundle (keeps the CRT consistent with the static archive).
      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            diffutils
            git
          pacboy: >-
            gcc:p

      - name: Build Franko compiler toolchain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path build/generated, build/classes | Out-Null

          java -Xmx500M -cp ".;lib/antlr-4.13.2-complete.jar" `
            org.antlr.v4.Tool -visitor -o build/generated Franko.g4
          if ($LASTEXITCODE -ne 0) { throw "ANTLR codegen failed with exit code $LASTEXITCODE" }

          $sources = @()
          $sources += (Get-ChildItem -Path . -Filter "*.java" -File | ForEach-Object { $_.FullName })
          $sources += (Get-ChildItem -Path build/generated -Filter "*.java" -File | ForEach-Object { $_.FullName })

          if ($sources.Count -eq 0) {
            throw "No Java source files found to compile."
          }

          javac --release 25 "-Xlint:all,-auxiliaryclass" `
            -cp ".;lib/antlr-4.13.2-complete.jar;build/generated" `
            -d build/classes $sources
          if ($LASTEXITCODE -ne 0) { throw "javac failed with exit code $LASTEXITCODE" }

      - name: Generate C++ with Franko compiler (success programs)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $CP = ".;lib/antlr-4.13.2-complete.jar;build/generated;build/classes"

          # Every program in tests/success/ is a positive test.
          $programs = Get-ChildItem -Path "tests/success" -Filter "main.fr" -Recurse -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }

          if ($programs.Count -eq 0) {
            throw "No .fr programs found under tests/success/."
          }

          foreach ($src in $programs) {
            $base = $src.Substring(0, $src.Length - 3)

            Write-Host ""
            Write-Host "=== $src ==="
            Write-Host ""

            # Optional per-fixture compiler flags in $base.flags: each
            # non-empty, non-comment line is word-split and appended
            # to the compiler invocation. Mirrors tests/run_specs_tests.sh.
            $extraFlags = @()
            $flagsFile = "$base.flags"
            if (Test-Path -LiteralPath $flagsFile) {
              foreach ($line in (Get-Content -LiteralPath $flagsFile)) {
                if ([string]::IsNullOrWhiteSpace($line)) { continue }
                $trimmed = $line.Trim()
                if ($trimmed.StartsWith('#')) { continue }
                $extraFlags += $trimmed -split '\s+'
              }
            }

            java -cp $CP Main $src -o "$base.cpp" @extraFlags
            if ($LASTEXITCODE -ne 0) {
              throw "Franko compiler failed for $src with exit code $LASTEXITCODE"
            }
          }

      - name: Compile and run success programs
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          # Excluded on Windows:
          #   string.fr — a CRLF checkout changes the program's output.
          for BASE in tests/success/*/main.fr; do
            BASE="${BASE%.fr}"

            if [[ "${BASE##*/}" == "string" ]]; then
              echo
              echo "Skipping $BASE on Windows: a CRLF checkout changes the program's output."
              continue
            fi

            echo
            echo "=== $BASE ==="
            echo

            g++ \
              -O3 -std=c++14 -Wall -Wextra -Wpedantic -Wshadow \
              -Iinclude -I"third_party/jemalloc/windows-x64/include" \
              "$BASE.cpp" "third_party/jemalloc/windows-x64/lib/jemalloc.lib" \
              -static-libstdc++ -static-libgcc \
              -o "$BASE.exe"

            ./"$BASE.exe" | tee "$BASE.actual.win"

            # Normalize CRLF: Windows runners check text files out with \r\n,
            # and UCRT stdout uses the same line endings.
            tr -d '\r' < "$BASE.actual.win" > "$BASE.actual"
            tr -d '\r' < "$BASE.expected" > "$BASE.want"

            echo
            echo "Comparing output against $BASE.expected:"
            diff -u "$BASE.want" "$BASE.actual"

            echo
            echo "PASS: $BASE.exe ran successfully, output matches $BASE.expected"
          done

      - name: Run failure spec programs
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $CP = ".;lib/antlr-4.13.2-complete.jar;build/generated;build/classes"

          # Every program in tests/failure/<family>/ is a negative test: the
          # Franko compiler must reject it (non-zero exit code). Recursion is
          # capped at one level so helper files that live deeper (for example
          # tests/failure/imports/lib/, imported by a fixture) are not run as
          # standalone fixtures — the Linux runner's tests/failure/*/*.fr
          # glob has the same two-level shape.
          $programs = Get-ChildItem -Path "tests/failure" -Filter "*.fr" -Recurse -Depth 1 -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }

          if ($programs.Count -eq 0) {
            throw "No .fr programs found under tests/failure/."
          }

          foreach ($src in $programs) {
            Write-Host ""
            Write-Host "=== $src ==="
            Write-Host ""

            # Optional per-fixture compiler flags in <case>.flags.
            # Mirrors tests/run_specs_tests.sh.
            $extraFlags = @()
            $flagsFile = $src.Substring(0, $src.Length - 3) + ".flags"
            if (Test-Path -LiteralPath $flagsFile) {
              foreach ($line in (Get-Content -LiteralPath $flagsFile)) {
                if ([string]::IsNullOrWhiteSpace($line)) { continue }
                $trimmed = $line.Trim()
                if ($trimmed.StartsWith('#')) { continue }
                $extraFlags += $trimmed -split '\s+'
              }
            }

            # The compiler is expected to reject the program and report the
            # diagnostics on stderr. Redirect stderr so the expected rejections
            # do not surface as GitHub error annotations (the Linux step uses
            # 2>/dev/null for the same reason); stdout stays visible.
            java -cp $CP Main $src -o "NUL" @extraFlags 2> $null
            if ($LASTEXITCODE -eq 0) {
              throw "$src compiled successfully but was expected to fail."
            }

            Write-Host ""
            Write-Host "PASS: $src was rejected by the Franko compiler as expected."
          }

          # The GitHub Actions pwsh wrapper exits the step with $LASTEXITCODE
          # when it is set, and the last java above intentionally exits
          # non-zero (the fixture was rejected). Exit 0 explicitly so the
          # step is green when every fixture was rejected as expected.
          exit 0

      - name: Generate C++ with Franko compiler (runtime programs)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $CP = ".;lib/antlr-4.13.2-complete.jar;build/generated;build/classes"

          # Every program in tests/runtime/<family>/ compiles but aborts at
          # run time; recursion is capped at one level, matching the runner's
          # tests/runtime/*/*.fr glob.
          $programs = Get-ChildItem -Path "tests/runtime" -Filter "*.fr" -Recurse -Depth 1 -File |
            Sort-Object Name |
            ForEach-Object { $_.FullName }

          if ($programs.Count -eq 0) {
            throw "No .fr programs found under tests/runtime/."
          }

          foreach ($src in $programs) {
            $base = $src.Substring(0, $src.Length - 3)

            Write-Host ""
            Write-Host "=== $src ==="
            Write-Host ""

            # Optional per-fixture compiler flags in $base.flags: each
            # non-empty, non-comment line is word-split and appended
            # to the compiler invocation. Mirrors tests/run_specs_tests.sh.
            $extraFlags = @()
            $flagsFile = "$base.flags"
            if (Test-Path -LiteralPath $flagsFile) {
              foreach ($line in (Get-Content -LiteralPath $flagsFile)) {
                if ([string]::IsNullOrWhiteSpace($line)) { continue }
                $trimmed = $line.Trim()
                if ($trimmed.StartsWith('#')) { continue }
                $extraFlags += $trimmed -split '\s+'
              }
            }

            java -cp $CP Main $src -o "$base.cpp" @extraFlags
            if ($LASTEXITCODE -ne 0) {
              throw "Franko compiler failed for $src with exit code $LASTEXITCODE"
            }
          }

      - name: Compile and run runtime programs
        shell: msys2 {0}
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          # Every program in tests/runtime/ is expected to abort at run
          # time (non-zero exit code). The abort output is not compared:
          # runtime messages may change freely.
          for BASE in tests/runtime/*/*.fr; do
            BASE="${BASE%.fr}"

            echo
            echo "=== $BASE ==="
            echo

            g++ \
              -O3 -std=c++14 \
              -Iinclude -I"third_party/jemalloc/windows-x64/include" \
              "$BASE.cpp" "third_party/jemalloc/windows-x64/lib/jemalloc.lib" \
              -static-libstdc++ -static-libgcc \
              -o "$BASE.exe"

            if ./"$BASE.exe" > /dev/null 2>&1; then
              echo "FAIL: $BASE.exe exited 0 but was expected to abort at runtime."
              exit 1
            fi

            echo
            echo "PASS: $BASE.exe aborted at runtime as expected."
          done
