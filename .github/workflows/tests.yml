name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-linux:
    name: Programs smoke + spec suite (Linux x86_64)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build Franko compiler toolchain
        run: |
          set -Eeuo pipefail

          mkdir -p build/generated build/classes

          java -Xmx500M -cp ".:lib/antlr-4.13.2-complete.jar" \
            org.antlr.v4.Tool -visitor -o build/generated Franko.g4

          javac --release 25 -Xlint:all,-auxiliaryclass \
            -cp ".:lib/antlr-4.13.2-complete.jar:build/generated" \
            -d build/classes *.java build/generated/*.java

      - name: Smoke test (programs/)
        run: |
          set -Eeuo pipefail
          ./programs/run_programs.sh

      - name: Full spec suite (tests/)
        run: |
          set -Eeuo pipefail
          ./tests/run_specs_tests.sh

  test-windows:
    name: Programs smoke + spec suite (Windows x64)
    runs-on: windows-2022

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # UCRT64, matching build-jemalloc.yml and the checked-in windows-x64
      # jemalloc bundle (keeps the CRT consistent with the static archive).
      - name: Setup MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p

      # The ps1 test scripts invoke g++.exe directly, so its directory
      # must be on PATH for the steps below. Probe the usual install
      # locations instead of hardcoding one.
      - name: Add MSYS2 g++ to PATH
        run: |
          $ErrorActionPreference = "Stop"

          $gxx = Get-Command "g++.exe" -ErrorAction SilentlyContinue
          if ($null -ne $gxx) {
            Write-Host "g++.exe already on PATH: $($gxx.Source)"
            exit 0
          }

          foreach ($dir in @("C:\msys64\ucrt64\bin", "C:\msys2\ucrt64\bin")) {
            if (Test-Path -LiteralPath (Join-Path $dir "g++.exe")) {
              Write-Host "Adding to PATH: $dir"
              Add-Content -Path $env:GITHUB_PATH -Value $dir
              exit 0
            }
          }

          throw "g++.exe not found on PATH and not under the usual MSYS2 locations."
        shell: pwsh

      - name: Build Franko compiler toolchain
        run: |
          $ErrorActionPreference = "Stop"

          New-Item -ItemType Directory -Force -Path build/generated, build/classes | Out-Null

          java -Xmx500M -cp ".;lib/antlr-4.13.2-complete.jar" `
            org.antlr.v4.Tool -visitor -o build/generated Franko.g4
          if ($LASTEXITCODE -ne 0) { throw "ANTLR codegen failed with exit code $LASTEXITCODE" }

          $sources = @()
          $sources += (Get-ChildItem -Path . -Filter "*.java" -File | ForEach-Object { $_.FullName })
          $sources += (Get-ChildItem -Path build/generated -Filter "*.java" -File | ForEach-Object { $_.FullName })

          if ($sources.Count -eq 0) {
            throw "No Java source files found to compile."
          }

          javac --release 25 "-Xlint:all,-auxiliaryclass" `
            -cp ".;lib/antlr-4.13.2-complete.jar;build/generated" `
            -d build/classes $sources
          if ($LASTEXITCODE -ne 0) { throw "javac failed with exit code $LASTEXITCODE" }

      - name: Smoke test (programs/)
        run: |
          $ErrorActionPreference = "Stop"
          .\programs\run_programs.ps1

      - name: Full spec suite (tests/)
        run: |
          $ErrorActionPreference = "Stop"
          .\tests\run_specs_tests.ps1
