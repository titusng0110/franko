name: Tests

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Programs smoke + language + library suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-11-arm
          - windows-2025
          - macos-26
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # No setup-java: every runner image ships JDKs preinstalled (though not
      # on PATH). JDK 25 everywhere; JDK 23 on windows-11-arm, whose image
      # has no JDK 25 (no aarch64 Temurin 25 exists).
      - name: Set up preinstalled JDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ runner.arch }}" -eq "ARM64") {
              $jdk = $env:JAVA_HOME_23_AARCH64
              $release = "23"
          } else {
              $jdk = $env:JAVA_HOME_25_X64
              $release = "25"
          }
          if (-not $jdk) {
              throw "Preinstalled JDK not found (JAVA_HOME_23_AARCH64 / JAVA_HOME_25_X64 unset)"
          }
          $javac = Join-Path $jdk "bin\javac.exe"
          if (-not (Test-Path -LiteralPath $javac)) {
              throw "javac.exe not found under $jdk\bin"
          }

          & (Join-Path $jdk "bin\java.exe") -version
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $jdk "bin")
          # franko_tools reads this (or --java-release) for javac --release.
          Add-Content -Path $env:GITHUB_ENV -Value "FRANKO_JAVA_RELEASE=$release"
          Write-Host "Using JDK at $jdk (javac --release $release)"

      - name: Set up preinstalled JDK (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -Eeuo pipefail
          shopt -s nullglob

          JDK=""
          # The image env vars are authoritative; the well-known install
          # locations are fallbacks (macos default java on PATH is 21, and
          # ubuntu/macOS env var suffixes differ by arch).
          for candidate in "${JAVA_HOME_25_arm64:-}" "${JAVA_HOME_25_X64:-}" \
              /usr/lib/jvm/temurin-25-jdk-* \
              /Library/Java/JavaVirtualMachines/temurin-25.jdk/Contents/Home; do
            if [[ -n "$candidate" && -x "$candidate/bin/javac" ]]; then
              JDK="$candidate"
              break
            fi
          done
          if [[ -z "$JDK" ]]; then
            echo "Error: preinstalled JDK 25 not found" >&2
            exit 1
          fi

          "$JDK/bin/java" -version
          echo "$JDK/bin" >> "$GITHUB_PATH"
          echo "Using JDK at $JDK (javac --release 25)"

      # The Python runners are stdlib-only; uv just provides the pinned
      # interpreter and the `regex` dependency used by the doc tools.
      # setup-uv has no v10 major tag, so pin the release commit as its
      # README recommends.
      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true

      # Windows runners ship Visual Studio with the C++ workload; compile.py
      # finds it through vswhere and loads vcvars64.bat/vcvarsarm64.bat.
      # Fail if MSVC is not selected before falling back to g++/clang++.
      - name: Verify MSVC cl.exe (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          uv run python -c "import compile; print(compile.find_cxx()); assert compile.cxx_family() == 'msvc'"

      - name: Build Franko compiler toolchain
        run: uv run python update_toolchain.py

      - name: Smoke test (programs/)
        run: uv run python programs/run_programs.py

      - name: Full language suite (language_tests/)
        run: uv run python language_tests/run_language_tests.py

      - name: Library tests (library_tests/)
        run: uv run python library_tests/run_library_tests.py
