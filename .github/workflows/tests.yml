name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Programs smoke + spec + library suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-2022

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # The Python runners are stdlib-only; uv just provides the pinned
      # interpreter and the `regex` dependency used by the doc tools.
      # setup-uv has no v10 major tag, so pin the release commit as its
      # README recommends.
      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true

      # UCRT64, matching build-jemalloc.yml and the checked-in windows-x64
      # jemalloc bundle (keeps the CRT consistent with the static archive).
      - name: Setup MSYS2 UCRT64
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          pacboy: >-
            gcc:p

      # The action installs MSYS2 wherever it decides (see its
      # msys2-location output), so export that exact ucrt64\bin directory
      # instead of guessing: the runners then find g++.exe through PATH,
      # and it is also where libwinpthread-1.dll lives for the test
      # binaries. The runners still probe the usual C:\msys64 locations as
      # a fallback for local Windows checkouts.
      - name: Add MSYS2 g++ to PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "${{ steps.msys2.outputs.msys2-location }}\ucrt64\bin"
          if (-not (Test-Path -LiteralPath (Join-Path $bin "g++.exe"))) {
            throw "g++.exe not found under $bin"
          }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          Write-Host "Added $bin to PATH"

      - name: Build Franko compiler toolchain
        run: uv run python update_toolchain.py

      - name: Smoke test (programs/)
        run: uv run python programs/run_programs.py

      - name: Full spec suite (tests/)
        run: uv run python tests/run_specs_tests.py

      - name: Library tests (library_tests/)
        run: uv run python library_tests/run_library_tests.py
