name: Tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Programs smoke + language + library suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-11-arm
          - windows-2025
          - macos-26
          - ubuntu-26.04
          - ubuntu-26.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      # The Python runners are stdlib-only; uv just provides the pinned
      # interpreter and the `regex` dependency used by the doc tools.
      # setup-uv has no v10 major tag, so pin the release commit as its
      # README recommends.
      - name: Set up uv and Python 3.13
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          python-version: '3.13'
          enable-cache: true

      # Every Windows runner image ships MSYS2 at C:\msys64 (not on PATH).
      # Reuse that preinstalled MSYS2 instead of installing our own copy:
      #   x64 (windows-2025): UCRT64 g++, matching build-jemalloc.yml and the
      #     checked-in windows-x86_64 jemalloc bundle (keeps the CRT
      #     consistent with the static archive).
      #   arm64 (windows-11-arm): the only native ARM64 MinGW-flavored
      #     toolchain is MSYS2 clangarm64 clang++; the image's gcc is an
      #     x86_64 build running under emulation and cannot produce ARM64
      #     output.
      # If no toolchain environment is present in C:\msys64 yet, install it
      # there with pacman.
      - name: Set up preinstalled MSYS2 C++ toolchain
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          if ("${{ runner.arch }}" -eq "ARM64") {
              $candidates = @(
                  "C:\msys64\clangarm64\bin",
                  "C:\msys64\ucrt64\bin",
                  "C:\msys64\mingw64\bin"
              )
              $packages = "mingw-w64-clang-aarch64-clang"
          } else {
              $candidates = @(
                  "C:\msys64\ucrt64\bin",
                  "C:\msys64\mingw64\bin",
                  "C:\msys64\clang64\bin"
              )
              $packages = "mingw-w64-ucrt-x86_64-gcc"
          }

          function Find-Toolchain {
              foreach ($dir in $candidates) {
                  foreach ($compiler in @("g++.exe", "clang++.exe")) {
                      if (Test-Path -LiteralPath (Join-Path $dir $compiler)) {
                          return @{ Dir = $dir; Compiler = $compiler }
                      }
                  }
              }
              return $null
          }

          $toolchain = Find-Toolchain
          if ($null -eq $toolchain) {
              Write-Host "No C++ toolchain under C:\msys64; installing: $packages"
              & C:\msys64\usr\bin\bash.exe -lc "pacman -S --noconfirm --needed $packages"
              if ($LASTEXITCODE -ne 0) {
                  throw "pacman failed to install $packages (exit code $LASTEXITCODE)"
              }
              $toolchain = Find-Toolchain
              if ($null -eq $toolchain) {
                  throw "C++ toolchain still missing after installing $packages"
              }
          }

          $cxx = Join-Path $toolchain.Dir $toolchain.Compiler
          & $cxx --version

          # The toolchain bin directory goes on PATH: the Python scripts find
          # the compiler through PATH alone (the error message says so), and
          # the test binaries find their runtime DLLs (e.g.
          # libwinpthread-1.dll) there too.
          Add-Content -Path $env:GITHUB_PATH -Value $toolchain.Dir
          # Pin CXX so franko_tools uses this exact compiler: on
          # windows-11-arm an emulated x86_64 g++ elsewhere on PATH must not
          # shadow the native clang++.
          Add-Content -Path $env:GITHUB_ENV -Value "CXX=$cxx"
          Write-Host "Using $cxx"

      - name: Build Franko compiler toolchain
        run: uv run python update_toolchain.py

      - name: Smoke test (programs/)
        run: uv run python programs/run_programs.py

      - name: Full language suite (language_tests/)
        run: uv run python language_tests/run_language_tests.py

      - name: Library tests (library_tests/)
        run: uv run python library_tests/run_library_tests.py
