name: Build jemalloc static bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04

          - target: linux-arm64
            os: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            bzip2 \
            file

      - name: Show build machine info
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Runner OS:   ${{ runner.os }}"
          echo "Target:      ${{ matrix.target }}"
          echo

          echo "uname -a:"
          uname -a

          echo
          echo "Compiler:"
          if command -v cc >/dev/null 2>&1; then
            cc --version || true
          fi

          echo
          echo "Archive tool:"
          ar --version || true

      - name: Build jemalloc static bundle
        shell: bash
        run: |
          set -Eeuo pipefail

          VERSION="5.3.1"
          TARGET="${{ matrix.target }}"

          ROOT="$PWD"
          SRC="$ROOT/third_party/src/jemalloc-$VERSION.tar.bz2"
          BUILD="$ROOT/third_party/build/jemalloc-$TARGET"
          PREFIX="$ROOT/third_party/jemalloc/$TARGET"

          if [[ ! -f "$SRC" ]]; then
            echo "Error: jemalloc source archive not found:"
            echo "  $SRC"
            exit 1
          fi

          echo "Building jemalloc $VERSION for $TARGET"
          echo "Source:  $SRC"
          echo "Build:   $BUILD"
          echo "Install: $PREFIX"
          echo

          rm -rf "$BUILD"
          rm -rf "$PREFIX"

          mkdir -p "$BUILD"
          mkdir -p "$PREFIX"

          tar -xjf "$SRC" -C "$BUILD" --strip-components=1

          cd "$BUILD"

          # Regenerate configure from configure.ac (mirrors upstream jemalloc CI).
          autoconf

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-doc \
            --with-jemalloc-prefix=je_

          make -j"$(nproc)"
          make install

          echo
          echo "Checking expected install outputs..."

          if [[ ! -f "$PREFIX/include/jemalloc/jemalloc.h" ]]; then
            echo "Error: expected jemalloc header missing:"
            echo "  $PREFIX/include/jemalloc/jemalloc.h"
            exit 1
          fi

          if [[ ! -f "$PREFIX/lib/libjemalloc.a" ]]; then
            echo "Error: expected jemalloc static library missing:"
            echo "  $PREFIX/lib/libjemalloc.a"
            exit 1
          fi

          echo
          echo "Pruning unnecessary jemalloc install files..."

          rm -rf "$PREFIX/bin"
          rm -rf "$PREFIX/share"
          rm -rf "$PREFIX/lib/pkgconfig"

          rm -f "$PREFIX/lib/libjemalloc_pic.a"
          rm -f "$PREFIX/lib/libjemalloc.so"
          rm -f "$PREFIX/lib/libjemalloc.so."*

          echo
          echo "Final jemalloc bundle:"
          find "$PREFIX" -type f | sort

      - name: Verify prefixed jemalloc symbols
        shell: bash
        run: |
          set -Eeuo pipefail

          TARGET="${{ matrix.target }}"
          PREFIX="$PWD/third_party/jemalloc/$TARGET"
          ARCHIVE="$PREFIX/lib/libjemalloc.a"

          echo "File info:"
          file "$ARCHIVE"

          echo
          echo "Checking for the je_-prefixed symbols consumed by"
          echo "FrankoRuntime.hpp and generated Franko code:"
          for sym in je_malloc je_calloc je_realloc je_free; do
            if ! nm -g "$ARCHIVE" | awk -v s="$sym" '
                ($1 != "U") && $NF == s { found = 1 }
                END { exit !found }'; then
              echo "Error: missing prefixed jemalloc symbol: $sym" >&2
              exit 1
            fi
            echo "OK: $sym"
          done

      - name: Smoke test (je_malloc/je_realloc/je_calloc/je_free round trip)
        shell: bash
        run: |
          set -Eeuo pipefail

          TARGET="${{ matrix.target }}"
          PREFIX="$PWD/third_party/jemalloc/$TARGET"
          ARCHIVE="$PREFIX/lib/libjemalloc.a"

          SMOKE="$PWD/jemalloc_smoke_$TARGET.c"
          BIN="$PWD/jemalloc_smoke_$TARGET"

          cat > "$SMOKE" <<'EOF'
          #include <jemalloc/jemalloc.h>

          int main(void) {
              void *p = je_malloc(64);
              if (!p) return 1;

              void *q = je_realloc(p, 128);
              if (!q) {
                  je_free(p);
                  return 2;
              }
              je_free(q);

              p = je_calloc(16, 4);
              if (!p) return 3;
              je_free(p);

              return 0;
          }
          EOF

          # Mirror the link pattern from compile.py (compile.link_flags):
          # archive by full path, -pthread, and -ldl.
          cc -O2 "$SMOKE" -I"$PREFIX/include" "$ARCHIVE" -pthread -ldl -o "$BIN"

          "$BIN"

          echo
          echo "Smoke test passed ($TARGET): je_malloc, je_calloc, je_realloc, je_free"

      - name: Upload jemalloc artifact
        uses: actions/upload-artifact@v7
        with:
          name: jemalloc-${{ matrix.target }}
          path: third_party/jemalloc/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

