name: Build jemalloc static bundles

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-unix:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-x86_64
            os: ubuntu-24.04

          - target: linux-arm64
            os: ubuntu-24.04-arm

          - target: macos-x86_64
            os: macos-15-intel

          - target: macos-arm64
            os: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -Eeuo pipefail

          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            autoconf \
            bzip2 \
            file

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -Eeuo pipefail

          brew install autoconf

      - name: Show build machine info
        shell: bash
        run: |
          set -Eeuo pipefail

          echo "Runner OS:   ${{ runner.os }}"
          echo "Target:      ${{ matrix.target }}"
          echo

          echo "uname -a:"
          uname -a

          echo
          echo "Compiler:"
          if command -v cc >/dev/null 2>&1; then
            cc --version || true
          fi

          echo
          echo "Archive tool:"
          ar --version || true

      - name: Build jemalloc static bundle
        shell: bash
        run: |
          set -Eeuo pipefail

          VERSION="5.3.1"
          TARGET="${{ matrix.target }}"

          ROOT="$PWD"
          SRC="$ROOT/third_party/src/jemalloc-$VERSION.tar.bz2"
          BUILD="$ROOT/third_party/build/jemalloc-$TARGET"
          PREFIX="$ROOT/third_party/jemalloc/$TARGET"

          if [[ ! -f "$SRC" ]]; then
            echo "Error: jemalloc source archive not found:"
            echo "  $SRC"
            exit 1
          fi

          echo "Building jemalloc $VERSION for $TARGET"
          echo "Source:  $SRC"
          echo "Build:   $BUILD"
          echo "Install: $PREFIX"
          echo

          rm -rf "$BUILD"
          rm -rf "$PREFIX"

          mkdir -p "$BUILD"
          mkdir -p "$PREFIX"

          tar -xjf "$SRC" -C "$BUILD" --strip-components=1

          cd "$BUILD"

          # Regenerate configure from configure.ac (mirrors upstream jemalloc CI).
          autoconf

          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-doc \
            --with-jemalloc-prefix=je_

          if [[ "${{ runner.os }}" == "macOS" ]]; then
            JOBS="$(sysctl -n hw.ncpu)"
          else
            JOBS="$(nproc)"
          fi

          make -j"$JOBS"
          make install

          echo
          echo "Checking expected install outputs..."

          if [[ ! -f "$PREFIX/include/jemalloc/jemalloc.h" ]]; then
            echo "Error: expected jemalloc header missing:"
            echo "  $PREFIX/include/jemalloc/jemalloc.h"
            exit 1
          fi

          if [[ ! -f "$PREFIX/lib/libjemalloc.a" ]]; then
            echo "Error: expected jemalloc static library missing:"
            echo "  $PREFIX/lib/libjemalloc.a"
            exit 1
          fi

          echo
          echo "Pruning unnecessary jemalloc install files..."

          rm -rf "$PREFIX/bin"
          rm -rf "$PREFIX/share"
          rm -rf "$PREFIX/lib/pkgconfig"

          rm -f "$PREFIX/lib/libjemalloc_pic.a"
          rm -f "$PREFIX/lib/libjemalloc.so"
          rm -f "$PREFIX/lib/libjemalloc.so."*
          rm -f "$PREFIX/lib/libjemalloc.dylib"
          rm -f "$PREFIX/lib/libjemalloc."*.dylib

          echo
          echo "Final jemalloc bundle:"
          find "$PREFIX" -type f | sort

      - name: Verify prefixed jemalloc symbols
        shell: bash
        run: |
          set -Eeuo pipefail

          TARGET="${{ matrix.target }}"
          PREFIX="$PWD/third_party/jemalloc/$TARGET"
          ARCHIVE="$PREFIX/lib/libjemalloc.a"

          echo "File info:"
          file "$ARCHIVE"

          echo
          echo "Checking for the je_-prefixed symbols consumed by"
          echo "FrankoRuntime.hpp and generated Franko code:"
          for sym in je_malloc je_calloc je_realloc je_free; do
            # macOS nm prefix symbols with '_'; require a definition (not 'U').
            if ! nm -g "$ARCHIVE" | awk -v s="$sym" '
                ($1 != "U") && ($NF == s || $NF == "_" s) { found = 1 }
                END { exit !found }'; then
              echo "Error: missing prefixed jemalloc symbol: $sym" >&2
              exit 1
            fi
            echo "OK: $sym"
          done

      - name: Smoke test (je_malloc/je_realloc/je_calloc/je_free round trip)
        shell: bash
        run: |
          set -Eeuo pipefail

          TARGET="${{ matrix.target }}"
          PREFIX="$PWD/third_party/jemalloc/$TARGET"
          ARCHIVE="$PREFIX/lib/libjemalloc.a"

          SMOKE="$PWD/jemalloc_smoke_$TARGET.c"
          BIN="$PWD/jemalloc_smoke_$TARGET"

          cat > "$SMOKE" <<'EOF'
          #include <jemalloc/jemalloc.h>

          int main(void) {
              void *p = je_malloc(64);
              if (!p) return 1;

              void *q = je_realloc(p, 128);
              if (!q) {
                  je_free(p);
                  return 2;
              }
              je_free(q);

              p = je_calloc(16, 4);
              if (!p) return 3;
              je_free(p);

              return 0;
          }
          EOF

          # Mirror the link pattern from compile.py (franko_tools.link_flags):
          # archive by full path, -pthread, and -ldl (Linux only).
          if [[ "${{ runner.os }}" == "Linux" ]]; then
            cc -O2 "$SMOKE" -I"$PREFIX/include" "$ARCHIVE" -pthread -ldl -o "$BIN"
          else
            cc -O2 "$SMOKE" -I"$PREFIX/include" "$ARCHIVE" -pthread -o "$BIN"
          fi

          "$BIN"

          echo
          echo "Smoke test passed ($TARGET): je_malloc, je_calloc, je_realloc, je_free"

      - name: Upload jemalloc artifact
        uses: actions/upload-artifact@v7
        with:
          name: jemalloc-${{ matrix.target }}
          path: third_party/jemalloc/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-2022
            msystem: UCRT64
            cc: gcc
            packages: >-
              mingw-w64-ucrt-x86_64-gcc
              mingw-w64-ucrt-x86_64-make
              mingw-w64-ucrt-x86_64-binutils

          - target: windows-arm64
            os: windows-11-arm
            msystem: CLANGARM64
            cc: clang
            packages: >-
              mingw-w64-clang-aarch64-clang
              mingw-w64-clang-aarch64-make
              mingw-w64-clang-aarch64-llvm-tools

    # Reuse the MSYS2 preinstalled on the image at C:\msys64 instead of
    # installing a fresh copy: a login bash reads $MSYSTEM and prepends the
    # matching environment's bin directory to PATH (the same behaviour as
    # msys2/setup-msys2's `msys2 {0}` shell).
    defaults:
      run:
        shell: C:\msys64\usr\bin\bash.exe -leo pipefail {0}

    env:
      MSYSTEM: ${{ matrix.msystem }}
      # Without this, the login bash runs MSYS2's /etc/profile, which ends
      # with `cd "$HOME"` - every step would then start in /home/runneradmin
      # instead of the checkout (this is what msys2/setup-msys2 sets for its
      # `msys2 {0}` shell too).
      CHERE_INVOKING: 1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # The image's MSYS2 only guarantees the msys base (bash, pacman, core
      # utils, tar, bzip2, file); the MinGW toolchain env and autoconf (used
      # to regenerate jemalloc's configure) may still need installing into
      # the preinstalled C:\msys64.
      - name: Set up preinstalled MSYS2 toolchain
        run: |
          set -Eeuo pipefail

          if ! command -v "${{ matrix.cc }}" >/dev/null 2>&1; then
              echo "Installing ${{ matrix.msystem }} toolchain: ${{ matrix.packages }}"
              pacman -S --noconfirm --needed ${{ matrix.packages }}
          fi

          if ! command -v autoconf >/dev/null 2>&1; then
              echo "Installing msys build dependency: autoconf"
              pacman -S --noconfirm --needed autoconf
          fi

          "${{ matrix.cc }}" --version

      - name: Show build machine info
        run: |
          set -Eeuo pipefail

          echo "Target:    ${{ matrix.target }}"
          echo "MSYSTEM:   $MSYSTEM"
          echo

          echo "uname -a:"
          uname -a

          echo
          echo "${{ matrix.cc }}:"
          which "${{ matrix.cc }}"
          "${{ matrix.cc }}" -v

          echo
          echo "ar:"
          if command -v ar >/dev/null 2>&1; then
            which ar
            ar --version || true
          else
            which llvm-ar
            llvm-ar --version || true
          fi

      - name: Build jemalloc static bundle
        run: |
          set -Eeuo pipefail

          VERSION="5.3.1"
          TARGET="${{ matrix.target }}"

          ROOT="$PWD"
          SRC="$ROOT/third_party/src/jemalloc-$VERSION.tar.bz2"
          BUILD="$ROOT/third_party/build/jemalloc-$TARGET"
          PREFIX="$ROOT/third_party/jemalloc/$TARGET"

          if [[ ! -f "$SRC" ]]; then
            echo "Error: jemalloc source archive not found:"
            echo "  $SRC"
            exit 1
          fi

          echo "Building jemalloc $VERSION for $TARGET"
          echo "Source:  $SRC"
          echo "Build:   $BUILD"
          echo "Install: $PREFIX"
          echo

          rm -rf "$BUILD"
          rm -rf "$PREFIX"

          mkdir -p "$BUILD"
          mkdir -p "$PREFIX"

          # ar comes from binutils (ucrt64); clangarm64 only ships the LLVM
          # tools, and jemalloc's configure honors $AR/$RANLIB.
          if ! command -v ar >/dev/null 2>&1; then
            export AR=llvm-ar
            export RANLIB=llvm-ranlib
          fi

          tar -xjf "$SRC" -C "$BUILD" --strip-components=1

          cd "$BUILD"

          # Regenerate configure from configure.ac (mirrors upstream jemalloc CI).
          autoconf

          CFLAGS="-O2 -pipe -Wno-cast-function-type -Wno-missing-field-initializers" \
          CXXFLAGS="-O2 -pipe -Wno-cast-function-type -Wno-missing-field-initializers" \
          ./configure \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static \
            --disable-cxx \
            --disable-doc \
            --with-jemalloc-prefix=je_

          # mingw32-make is the "make" command of the MinGW environments.
          mingw32-make -j"$(nproc)"
          mingw32-make install

          echo
          echo "Checking expected bundle outputs..."

          if [[ ! -f "$PREFIX/include/jemalloc/jemalloc.h" ]]; then
            echo "Error: expected jemalloc header missing:"
            echo "  $PREFIX/include/jemalloc/jemalloc.h"
            exit 1
          fi

          if [[ ! -f "$PREFIX/lib/jemalloc.lib" ]]; then
            echo "Error: expected jemalloc static library missing:"
            echo "  $PREFIX/lib/jemalloc.lib"
            exit 1
          fi

          echo
          echo "Pruning unnecessary jemalloc install files..."

          rm -rf "$PREFIX/bin"
          rm -rf "$PREFIX/share"
          rm -rf "$PREFIX/lib/pkgconfig"

          rm -f "$PREFIX/lib/jemalloc_s.lib"
          rm -f "$PREFIX/lib/libjemalloc_pic.a"
          rm -f "$PREFIX/lib/libjemalloc.dll"
          rm -f "$PREFIX/lib/libjemalloc.dll.a"
          rm -f "$PREFIX/lib/libjemalloc_s.a"
          rm -f "$PREFIX/lib/libjemalloc.so"
          rm -f "$PREFIX/lib/libjemalloc.so."*
          rm -f "$PREFIX/lib/libjemalloc.dylib"
          rm -f "$PREFIX/lib/libjemalloc."*.dylib

          echo
          echo "Final jemalloc bundle:"
          find "$PREFIX" -type f | sort

      - name: Verify prefixed jemalloc symbols
        run: |
          set -Eeuo pipefail

          TARGET="${{ matrix.target }}"
          PREFIX="$PWD/third_party/jemalloc/$TARGET"
          ARCHIVE="$PREFIX/lib/jemalloc.lib"

          # The MinGW environments may not expose the cross-prefixed name,
          # and clangarm64 only ships llvm-nm; try each before plain nm
          # (also from the same environment's binutils).
          NM="$(command -v x86_64-w64-mingw32-nm || command -v aarch64-w64-mingw32-nm || command -v llvm-nm || command -v nm || true)"
          if [[ -z "$NM" ]]; then
            echo "Error: no nm binary found on PATH" >&2
            exit 1
          fi

          echo "File info:"
          file "$ARCHIVE"

          echo
          echo "nm: $NM"

          echo
          echo "Checking for the je_-prefixed symbols consumed by"
          echo "FrankoRuntime.hpp and generated Franko code:"
          for sym in je_malloc je_calloc je_realloc je_free; do
            if ! "$NM" -g "$ARCHIVE" | awk -v s="$sym" '
                ($1 != "U") && $NF == s { found = 1 }
                END { exit !found }'; then
              echo "Error: missing prefixed jemalloc symbol: $sym" >&2
              exit 1
            fi
            echo "OK: $sym"
          done

      - name: Smoke test (je_malloc/je_realloc/je_calloc/je_free round trip)
        run: |
          set -Eeuo pipefail

          TARGET="${{ matrix.target }}"
          PREFIX="$PWD/third_party/jemalloc/$TARGET"
          ARCHIVE="$PREFIX/lib/jemalloc.lib"

          SMOKE="$PWD/jemalloc_smoke.c"
          BIN="$PWD/jemalloc_smoke.exe"

          cat > "$SMOKE" <<'EOF'
          #include <jemalloc/jemalloc.h>

          int main(void) {
              void *p = je_malloc(64);
              if (!p) return 1;

              void *q = je_realloc(p, 128);
              if (!q) {
                  je_free(p);
                  return 2;
              }
              je_free(q);

              p = je_calloc(16, 4);
              if (!p) return 3;
              je_free(p);

              return 0;
          }
          EOF

          # Mirror compile.py: the archive is passed by full path
          # (GNU ar archive with a .lib extension, built by MinGW).
          "${{ matrix.cc }}" -O2 "$SMOKE" -I"$PREFIX/include" "$ARCHIVE" -o "$BIN"

          "$BIN"

          echo
          echo "Smoke test passed ($TARGET): je_malloc, je_calloc, je_realloc, je_free"

      - name: Upload jemalloc artifact
        uses: actions/upload-artifact@v7
        with:
          name: jemalloc-${{ matrix.target }}
          path: third_party/jemalloc/${{ matrix.target }}
          if-no-files-found: error
          retention-days: 30